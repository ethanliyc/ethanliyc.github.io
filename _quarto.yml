# Quarto Setting ###################################################
project:
  type: website     # Tell quarto this is a website project 
  output-dir: docs  # The dir of all rendered html.
  
  ## quarto preview setting =======================================
  preview: 
    port: 22222         # preview port (just for local preview)
    browser: true       # Pop-up a browser when clicking preview
    watch-inputs: true  # Automatic update if any changes are made
    navigate: true      # allow page switching whenever the link to other pages are clicked.

execute:
  freeze: auto  # auto: update html whenever its original qmd is changed. true: update html only if the user asks quarto to do so.

# Formatting ###################################################
format:
  html:
    # Import font from google (to be put in each html)
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    fontsize: 1.1em         # font size (global setting)
    theme: 
      - journal             # theme on https://bootswatch.com/
      - html/styles.scss
    toc: false              # Display toc or not (globally). false globbaly and true for specific page is recommended
    code-link: true         # Enable code section if any
    anchor-sections: true      # Create a linkable hash (#) after each header in an article 
    fig-cap-location: margin   # figure caption location
    reference-location: document  # location of the footnote. margin: ref is placed in the RHS of the page
    footnotes-hover: true  # Whether the footnote is displayed when the curser is on it. 
    
    
# Language Formatting ###########################################
# set en means: (1) Search engine and the browser perceive the website as English. (2) font prioritize English (see styles.scss)
lang: en
    